<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 3 78 90" width="78" height="90" fill="none">
  <!-- Same geometry as Logo.jsx, cropped to the mark's own bounds and drawn a
       stroke heavier. Padding inside the file only shrinks the drawing inside
       the 16px a browser gives a tab, and a 3.2 stroke is a hairline there. -->
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="a" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#7df3b4" />
      <stop offset="100%" stop-color="#2fb87c" />
    </linearGradient>
  </defs>
  <g filter="url(#g)">
    <g stroke="url(#a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M40 15 C59 5, 80 16, 83 38 C86 58, 77 72, 66 78" />
      <path d="M45 21 C61 15, 75 25, 77 43 C78 57, 72 66, 64 71" />
      <path d="M40 15 C30 24, 25 35, 28 43 C29 46, 21 52, 19 58 C18 61, 24 62, 27 62 C28 66, 25 68, 29 70 C32 72, 36 72, 38 77" />
      <path d="M38 77 C43 83, 52 85, 60 82" />
      <path d="M75 63 C80 73, 77 84, 70 87" />
      <path d="M79 34 C79 22, 62 17, 54 28 C46 39, 55 53, 66 49 C74 46, 75 37, 68 35 C63 34, 60 39, 63 43" />
    </g>
    <g fill="url(#a)">
      <circle cx="40" cy="15" r="4.6" /><circle cx="83" cy="38" r="4.4" />
      <circle cx="54" cy="28" r="4.2" /><circle cx="66" cy="49" r="4.2" />
      <circle cx="77" cy="43" r="3.8" /><circle cx="27" cy="62" r="4.0" />
      <circle cx="38" cy="77" r="4.2" /><circle cx="60" cy="82" r="4.4" />
      <circle cx="70" cy="87" r="4.0" />
    </g>
  </g>
</svg>
