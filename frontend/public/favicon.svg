<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 6 80 84" width="80" height="84" fill="none">
  <!-- Cropped square to the mark's own bounds. A generous margin is right on a
       website header and wrong here: padding inside the file only shrinks the
       drawing inside the 16px a browser gives a tab. Strokes are heavier than
       the header lockup's, and the four nodes are a size up, for the same
       reason — at 16px a 5px stroke on a 96 box is a hairline. -->
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="a" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#7df3b4" />
      <stop offset="100%" stop-color="#2fb87c" />
    </linearGradient>
  </defs>
  <g stroke="url(#a)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#g)">
    <path d="M36 20 C56 10, 79 22, 81 45 C83 64, 71 76, 62 80" />
    <path d="M36 20 C26 29, 22 41, 26 47 C28 51, 19 57, 17 62 C16 65, 22 66, 25 66 C26 70, 24 72, 27 74 C30 76, 35 76, 37 81 C44 85, 55 84, 62 80" />
    <path d="M74 41 C74 32, 62 29, 57 37 C52 46, 60 55, 67 51 C71 49, 71 44, 68 43" />
  </g>
  <g fill="url(#a)" filter="url(#g)">
    <circle cx="36" cy="20" r="6" />
    <circle cx="81" cy="45" r="5.5" />
    <circle cx="57" cy="37" r="5.5" />
    <circle cx="25" cy="66" r="5" />
  </g>
</svg>
